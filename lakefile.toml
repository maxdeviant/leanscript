name = "leanscript"
version = "0.2.0"
defaultTargets = ["leanscript", "Js"]
srcDir = "src"

[[lean_lib]]
name = "LeanScript"

# The library that compiled programs import to interoperate with JS.
[[lean_lib]]
name = "Js"

[[lean_exe]]
name = "leanscript"
root = "Main"
# The compiler elaborates user code, which may run `#eval`, macros, and other
# compile-time code through the interpreter.
supportInterpreter = true

# Libraries that test fixtures import, which aren't built by default.
[[lean_lib]]
name = "InitOrderModule"
srcDir = "../tests/fixtures/lib"

[[lean_lib]]
name = "InitOrderPlain"
srcDir = "../tests/fixtures/lib"
